# 공통 설정. local/prod 모두에 적용된다.
# 값은 환경변수(${...})로만 받는다. 시크릿을 여기에 직접 쓰지 않는다. (설계서 B-2)

spring:
  application:
    name: stock-news
  profiles:
    default: local   # 프로파일을 지정하지 않고 실행하면 local로 뜬다. prod는 SPRING_PROFILES_ACTIVE=prod로 지정.

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate   # 테이블은 Flyway가 만든다. JPA는 Entity와 테이블이 맞는지 검사만. (설계서 B-8)
    open-in-view: false    # DB 연결을 요청 처리가 끝날 때까지 붙잡지 않게 한다.

  flyway:
    enabled: true          # 앱 시작 시 src/main/resources/db/migration 의 SQL을 순서대로 적용.

# Massive(구 Polygon) API: 종목 조회, 뉴스, 일봉, 휴장일
massive:
  base-url: https://api.massive.com
  api-key: ${POLYGON_API_KEY:}   # 키는 요청 URL이 아니라 Authorization 헤더로 보낸다. (로그에 안 남게)
  connect-timeout: 5s
  read-timeout: 10s

stocknews:
  fixed-user:
    email: admin@stocknews.local   # 인증 전까지 모든 요청을 이 사용자로 처리. V4 마이그레이션과 같은 값.
  watchlist:
    max-per-user: 5                # 일반 사용자(USER)당 관심 종목 최대 수. 관리자(ADMIN)는 무제한.
